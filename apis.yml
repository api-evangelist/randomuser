apis:
  - aid: randomuser:randomuser
    name: Random User Generator API
    description: >-
      Single GET endpoint that returns a configurable batch of synthetic users. Supports up to 5000 results per request,
      multi-nationality mixing, field include/exclude projection, deterministic seeds with pagination, multiple
      serialization formats, and path-pinned versioning (1.0 - 1.4).
