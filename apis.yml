aid: randomuser
name: Random User Generator
description: >-
  Free random user data API for generating realistic fake user profiles with names, addresses, photos, and contact
  data for UI mockups and testing. Open-source REST API with no authentication required, seedable for reproducibility,
  and multi-format output (JSON, CSV, YAML, XML).
