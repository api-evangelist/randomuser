apiVersion: naftiko.dev/v1
kind: Capability
metadata:
  name: randomuser-users
  title: RandomUser - Generate Users
  description: Shared capability covering the single Random User Generator endpoint (GET /). Used by higher-level workflow capabilities that need synthetic user data.
  provider: randomuser
  api: randomuser
  source: openapi/randomuser-openapi.yml
spec:
  operations:
    - id: generateUsers
      method: GET
      path: /
      summary: Generate Random Users
      tags: [Users]
      inputs:
        - name: results
          type: integer
          default: 1
          max: 5000
        - name: gender
          type: string
          enum: [male, female]
        - name: nat
          type: string
          description: Comma-separated ISO 3166-1 alpha-2 codes (v1.4 supported set).
        - name: inc
          type: string
        - name: exc
          type: string
        - name: seed
          type: string
        - name: page
          type: integer
          default: 1
        - name: format
          type: string
          enum: [json, pretty, csv, yaml, xml]
          default: json
        - name: password
          type: string
        - name: noinfo
          type: boolean
        - name: dl
          type: boolean
        - name: callback
          type: string
      outputs:
        - User
        - UserResponse
    - id: generateUsersVersioned
      method: GET
      path: /{version}/
      summary: Generate Random Users (Pinned Version)
      tags: [Users]
      inputs:
        - name: version
          type: string
          enum: ["1.0", "1.1", "1.2", "1.3", "1.4"]
          required: true
  auth:
    type: none
  rateLimit:
    documented: false
    note: No published per-key or per-IP cap. Best-effort, donation funded.
